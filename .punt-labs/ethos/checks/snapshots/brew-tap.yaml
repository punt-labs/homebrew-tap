checks:
  formula-style-handoff:
    profile: linux-worktree-v1
    isolation: {darwin: live-verified}
    epoch: brew-tap-v1
    sources:
      mode: worktree
    path: [/home/linuxbrew/.linuxbrew/bin, /opt/homebrew/bin]
    env:
      HOMEBREW_CACHE: '{scratch}/homebrew-cache'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    system:
      tools: [bash, brew, git]
      platforms:
        linux-amd64:
          dirs: [/home/linuxbrew/.linuxbrew]
        linux-arm64:
          dirs: [/home/linuxbrew/.linuxbrew]
        darwin-arm64:
          dirs:
            - /opt/homebrew/bin
            - /opt/homebrew/Library/Homebrew/rubocops
            - /opt/homebrew/Library/Homebrew/vendor/bundle
          files:
            - /opt/homebrew/Library/.rubocop.yml
            - /opt/homebrew/Library/tap_rubocop_style.yml
            - /opt/homebrew/Library/Homebrew/Gemfile.lock
            - /opt/homebrew/Library/Homebrew/rubocops.rb
            - /opt/homebrew/Library/Homebrew/style.rb
            - /opt/homebrew/Library/Homebrew/utils/rubocop.rb
