checks:
  formula-style-handoff:
    profile: linux-worktree-v1
    epoch: brew-tap-v1
    sources:
      mode: worktree
    path: [/home/linuxbrew/.linuxbrew/bin, /opt/homebrew/bin]
    env:
      HOMEBREW_CACHE: '{scratch}/homebrew-cache'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    system:
      tools: [bash, brew, git]
      platforms:
        linux-amd64:
          dirs: [/home/linuxbrew/.linuxbrew]
        linux-arm64:
          dirs: [/home/linuxbrew/.linuxbrew]
        darwin-arm64:
          dirs: [/opt/homebrew]
