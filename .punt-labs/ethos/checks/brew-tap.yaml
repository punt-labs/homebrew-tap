name: brew-tap
description: Advisory formula edits and blocking commit and handoff checks.
checks:
  - name: formula-style-edit
    stage: edit
    files: ['Formula/*.rb']
    adapter: exec
    run: [brew, style, '{file}']
    on_fail: advisory
    timeout: 15s
  - name: formula-style-commit
    stage: commit
    files: ['Formula/*.rb']
    adapter: exec
    run: [brew, style, '{files}']
    on_fail: block
    timeout: 120s
  - name: formula-style-handoff
    stage: handoff
    files: ['Formula/*.rb']
    adapter: exec
    run: [brew, style, '{files}']
    on_fail: block
    timeout: 10m
